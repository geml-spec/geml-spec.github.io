# Build and deploy geml-spec.github.io.
#
# The site authors only its own pages; the specification, guides, the
# playground bundle and the codemap come from a geml-spec/geml checkout at the
# ref named in geml-source.json, so a deploy can never ship a stale copy of any
# of them. One deploy at a time, never cancelled mid-flight.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Which geml commit to build from
        id: source
        run: echo "ref=$(jq -r .ref geml-source.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: geml-spec/geml
          ref: ${{ steps.source.outputs.ref }}
          path: geml-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            geml-src/geml-parser/package-lock.json
            geml-src/integrations/geml-viewer/package-lock.json

      - name: Install the site
        run: npm ci

      - name: Build the parser
        working-directory: geml-src/geml-parser
        run: npm ci && npm run build

      - name: Install the viewer (esbuild, KaTeX, Mermaid)
        working-directory: geml-src/integrations/geml-viewer
        run: npm ci

      - name: Sync spec, guides and illustrated pages
        run: node scripts/sync-geml.mjs
        env: { GEML_SRC: geml-src }

      - name: Bundle the playground
        run: node scripts/build-playground.mjs
        env: { GEML_SRC: geml-src }

      - name: Build the parser's code graph
        run: node scripts/build-codemap.mjs
        env: { GEML_SRC: geml-src }

      - name: geml check every demo document
        run: node scripts/check-demos.mjs
        env: { GEML_SRC: geml-src }

      - name: Build the site
        run: npm run build

      # The repository's Pages source was "branch main, path /" (the old
      # redirect page). enablement switches it to GitHub Actions on first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
