# Build and deploy geml-spec.github.io.
#
# Everything the site serves is committed here. The pieces made from the
# parser — the playground bundle and its fonts, the parser's code graph, the
# logos — are pushed in by geml-spec/geml's website workflow whenever its main
# changes, so this build needs nothing but VitePress. One deploy at a time,
# never cancelled mid-flight.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the site
        run: npm ci

      - name: Build the site
        run: npm run build

      # The repository's Pages source was "branch main, path /" (the old
      # redirect page). enablement switches it to GitHub Actions on first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
